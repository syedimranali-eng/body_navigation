    .bottom{grid-area:bottom;display:flex;align-items:center;gap:9px;padding:11px 16px;border-top:1px solid var(--line);background:rgba(7,16,24,.93);z-index:4}.split{width:1px;height:32px;background:var(--line);margin:0 2px}.control-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.grow{flex:1}.btn{border:1px solid #315164;background:#102332;color:#d7e6ea;border-radius:7px;padding:7px 9px;cursor:pointer;font-size:12px;transition:.16s ease}.btn:hover{background:#18384b;border-color:#4b8295}.btn.primary{background:#167d78;border-color:#36c6ba;color:#fff}.btn.active{background:#2b5570;border-color:#65d4e0;color:#fff}.btn.danger{color:#ffb1b6;border-color:#8f3e49}.btn:disabled{opacity:.42;cursor:not-allowed}.view-btn{min-width:45px;padding-inline:7px}

</head>
<body>
<main id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>ANATOMY JOINT LAB</span><span class="tag">3D INTERACTIVE</span></div>
    <label class="search" aria-label="Search anatomy"><span aria-hidden="true">⌕</span><input id="search" type="search" autocomplete="off" placeholder="Search bone, joint, or region…" /></label>
    <div class="top-actions"><button class="btn" id="labelsBtn" type="button">Labels</button><button class="btn" id="xrayBtn" type="button">X-ray</button><button class="btn primary" id="screenshot" type="button">Export PNG</button></div>
  </header>
  <aside class="side nav" aria-label="Anatomical navigation">
    <h2 class="panel-title">Body navigator</h2>
    <nav class="tree" id="tree">
      <button class="branch" data-region="whole-body">BODY SYSTEM</button>
      <button class="indent" data-region="head">⌄ Head &amp; jaw</button><button class="tiny" data-id="skull">Skull</button><button class="tiny" data-id="mandible">Mandible / TMJ</button>
      <button class="indent" data-region="neck">⌄ Neck</button><button class="tiny" data-id="occiput-c1">Occiput–C1</button><button class="tiny" data-id="c1-c2">C1–C2</button>
      <button class="indent" data-region="left-arm">⌄ Left arm</button><button class="tiny" data-region="left-hand">Hand &amp; fingers</button>
      <button class="indent" data-region="right-arm">⌄ Right arm</button><button class="tiny" data-region="right-hand">Hand &amp; fingers</button>
      <button class="indent" data-region="spine">⌄ Thoracic &amp; lumbar spine</button><button class="tiny" data-id="spinal-discs">Intervertebral discs</button>
      <button class="indent" data-region="pelvis">Pelvis &amp; hips</button>
      <button class="indent" data-region="left-leg">⌄ Left leg</button><button class="tiny" data-region="left-foot">Ankle &amp; foot</button>
      <button class="indent" data-region="right-leg">⌄ Right leg</button><button class="tiny" data-region="right-foot">Ankle &amp; foot</button>
    </nav>
  </aside>
  <section id="stage" aria-label="Interactive 3D anatomical viewport">
    <div class="canvas-wrap" id="canvasWrap"></div>
    <div class="stage-card"><h1>Full skeletal joint system</h1><p>Drag to orbit · Scroll to zoom · Click any structure to inspect</p></div>
    <div class="hover-card" id="hoverCard"></div>
    <div class="viewport-note">Selectable bones · joints · cartilage · ligaments</div>
    <div class="toast" id="toast" aria-live="polite"></div>
  </section>
  <aside class="side info" aria-label="Structure information">
    <div id="infoContent"></div>
  </aside>
  <footer class="bottom">
    <div class="control-group"><button class="btn primary" id="explode" type="button">Exploded view</button><button class="btn" id="reassemble" type="button">Reassemble</button><span class="split"></span><button class="btn" id="isolate" type="button">Isolate</button><button class="btn danger" id="remove" type="button">Remove</button><button class="btn" id="detach" type="button">Detach</button><button class="btn" id="restore" type="button">Restore</button></div>
    <div class="grow"></div>
    <div class="control-group"><button class="btn view-btn" data-view="front" type="button">Front</button><button class="btn view-btn" data-view="back" type="button">Back</button><button class="btn view-btn" data-view="left" type="button">Left</button><button class="btn view-btn" data-view="right" type="button">Right</button><button class="btn" id="fullbody" type="button">Full body</button><button class="btn" id="resetcam" type="button">Reset camera</button></div>
  </footer>
</main>

  function focusEntry(e){const p=e.kind==='region'?e.center:e.object.getWorldPosition(new THREE.Vector3());const distance=e.kind==='region'?8:4;const direction=camera.position.clone().sub(controls.target).normalize();const next=p.clone().add(direction.multiplyScalar(distance));animateCamera(next,p,520);}
  function animateCamera(pos,target,duration=550){const a=camera.position.clone(),t=controls.target.clone(),start=performance.now();function tick(now){const k=Math.min(1,(now-start)/duration),q=1-Math.pow(1-k,3);camera.position.lerpVectors(a,pos,q);controls.target.lerpVectors(t,target,q);if(k<1)requestAnimationFrame(tick);}requestAnimationFrame(tick)}
  function renderInfo(){const el=document.getElementById('infoContent');if(!selected){el.innerHTML='<div class="selection-head"><div class="kindline">Interactive 3D model</div><h2>Select a structure</h2><p>Choose a region in the body navigator or click a bone, joint, cartilage, ligament, or soft-tissue structure in the viewport.</p></div>'+layersUI();return}if(selected.kind==='region'){const n=selectionMembers().filter(x=>!x.hidden).length;el.innerHTML=`<div class="selection-head"><div class="kindline">Region · ${n} visible components</div><h2>${selected.name}</h2><p>${selected.description}</p></div><div class="info-grid"><div class="field"><span>Selection scope</span><b>${n} independently identified anatomical components</b></div><div class="field"><span>Available actions</span><b>Focus, isolate, remove, detach, restore and explode</b></div></div>${actionsUI()}${layersUI()}`;return}const d=selected;const hasROM=!!d.range;el.innerHTML=`<div class="selection-head"><div class="kindline">${d.kind} · ID ${d.id}</div><h2>${d.name}</h2><p>${d.kind==='joint'?'Joint-by-joint anatomical inspection and constrained range-of-motion control.':`Independent ${d.kind} object. Its selection, visibility and transform are separate from all other components.`}</p></div>${d.type?`<div class="info-grid"><div class="field"><span>Joint classification</span><b>${d.type}</b></div><div class="field"><span>Connected bones</span><b>${d.bones}</b></div><div class="field"><span>Primary movement</span><b>${d.moves}</b></div><div class="field"><span>Function</span><b>${d.function}</b></div><div class="field"><span>Mobility</span><b>${d.mobility}</b></div><div class="field"><span>Stability</span><b>${d.stability}</b></div></div>`:`<div class="info-grid"><div class="field"><span>Region membership</span><b>${d.tags.join(' · ')}</b></div><div class="field"><span>Object state</span><b>${d.hidden?'Hidden':d.detached?'Detached':'Attached and visible'}</b></div></div>`}${hasROM?`<div class="rom"><div class="rom-head"><strong>Range of motion — ${d.axis}</strong><output id="romValue">${d.range[0]}°</output></div><input id="romRange" type="range" min="${d.range[0]}" max="${d.range[1]}" value="${d.value??0}" step="1" aria-label="${d.axis} range of motion"/><p class="rom-hint">Motion is constrained to the report’s joint type and an anatomically plausible range. Drag the control to demonstrate movement.</p></div>`:''}${actionsUI()}${layersUI()}`;const range=document.getElementById('romRange');if(range)range.addEventListener('input',()=>applyROM(+range.value));}
  function actionsUI(){return '<div class="part-actions"><button class="btn primary" id="infoIsolate" type="button">Isolate</button><button class="btn danger" id="infoRemove" type="button">Remove</button><button class="btn" id="infoDetach" type="button">Detach</button><button class="btn" id="infoRestore" type="button">Restore / reset</button></div><p class="action-note">Remove is non-destructive: every hidden or detached item can be restored. A parent region carries its child components while preserving their individual IDs.</p>';}
  function layersUI(){return `<div class="layer-title">Visibility layers</div><div class="layers">${[['whole','Whole skeleton'],['bones','Individual bones'],['joints','Joints'],['cartilage','Cartilage'],['discs','Intervertebral discs'],['menisci','Menisci'],['ligaments','Ligaments'],['muscles','Muscles'],['skin','Skin / external body'],['labels','Labels']].map(([id,n])=>`<label class="check"><input type="checkbox" data-layer="${id}" checked />${n}</label>`).join('')}</div><div class="legend"><span class="dot bone"></span>bone &nbsp; <span class="dot joint"></span>joint &nbsp; <span class="dot soft"></span>soft tissue &nbsp; <span class="dot selected"></span>selected</div>`;}
  function setLabels(on){layers.labels.visible=on;labelSprites.forEach(s=>s.visible=on);document.getElementById('labelsBtn').classList.toggle('active',on)}
  function bindInfo(){document.getElementById('infoContent').onclick=e=>{const id=e.target.id;if(id==='infoIsolate')isolateSelected();if(id==='infoRemove')removeSelected();if(id==='infoDetach')detachSelected();if(id==='infoRestore')restoreSelected();};document.querySelectorAll('[data-layer]').forEach(input=>input.addEventListener('change',()=>{const id=input.dataset.layer;if(id==='whole'){bodyRoot.visible=input.checked}else if(id==='labels'){setLabels(input.checked)}else{layers[id].visible=input.checked}}));}
  const originalRenderInfo=renderInfo;renderInfo=function(){originalRenderInfo();bindInfo();};
  function applyROM(value){if(!selected?.range)return;selected.value=value;document.getElementById('romValue').textContent=`${value}°`;const rig=motionRigs.get(selected.rig);if(!rig)return;const rad=THREE.MathUtils.degToRad(value);const id=selected.id;if(/radioulnar/.test(id))rig.rotation.y=rad;else if(/subtalar/.test(id))rig.rotation.z=rad;else if(/shoulder|hip/.test(id))rig.rotation.z=rad;else if(/occiput|c1-c2|facet/.test(id))rig.rotation.y=rad;else if(/tmj/.test(id))rig.rotation.x=rad*.45;else rig.rotation.z=rad;}
  function refreshVisibility(){const allowed=isolated?new Set(selectionMembers(isolated)):null;allObjects.forEach(e=>{const visible=!e.hidden&&(!allowed||allowed.has(e));e.object.visible=visible;});setLabels(document.querySelector('[data-layer="labels"]')?.checked??true);}
  function isolateSelected(){if(!selected)return toast('Select a structure to isolate.');isolated=selected;refreshVisibility();toast(`${selected.name} isolated`);}
  function removeSelected(){if(!selected)return toast('Select a structure to remove.');selectionMembers().forEach(e=>e.hidden=true);refreshVisibility();toast(`${selected.name} removed — use Restore to bring it back.`);renderInfo();}
  function detachSelected(){if(!selected)return toast('Select a structure to detach.');const members=selectionMembers();members.forEach((e,i)=>{e.detached=true;e.detachTarget=(e.explode||V(.5,0,0)).clone().multiplyScalar(3.8).add(V((i%4)*.08,0,0));});toast(`${selected.name} detached for inspection`);renderInfo();}
  function restoreSelected(){if(!selected){return restoreAll()}selectionMembers().forEach(e=>{e.hidden=false;e.detached=false;e.detachTarget=V();if(e.range){e.value=0;const rig=motionRigs.get(e.rig);if(rig)rig.rotation.set(0,0,0)}});isolated=null;refreshVisibility();toast(`${selected.name} restored`);renderInfo();}
  function restoreAll(){allObjects.forEach(e=>{e.hidden=false;e.detached=false;e.detachTarget=V();if(e.range)e.value=0});motionRigs.forEach(r=>r.rotation.set(0,0,0));isolated=null;exploded=false;linkLines.visible=false;refreshVisibility();toast('Full anatomical system restored');}
  function toggleExplode(on=!exploded){exploded=on;linkLines.visible=on;document.getElementById('explode').classList.toggle('active',on);toast(on?'Exploded relationship view active':'Model reassembled');}
  function toast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2200)}
  document.getElementById('tree').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;selectById(b.dataset.id||b.dataset.region)});
  document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();if(!q)return;const found=[...items.values(),...regionMap.values()].find(v=>v.name.toLowerCase().includes(q)||v.id.includes(q));if(found)select(found,false)});
  document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.trim().toLowerCase();const found=[...items.values(),...regionMap.values()].find(v=>v.name.toLowerCase().includes(q)||v.id.includes(q));if(found)select(found)}});
  document.getElementById('explode').onclick=()=>toggleExplode(true);document.getElementById('reassemble').onclick=()=>toggleExplode(false);document.getElementById('isolate').onclick=isolateSelected;document.getElementById('remove').onclick=removeSelected;document.getElementById('detach').onclick=detachSelected;document.getElementById('restore').onclick=restoreSelected;document.getElementById('fullbody').onclick=()=>selectById('whole-body');document.getElementById('resetcam').onclick=()=>{animateCamera(V(13,7.4,24),V(0,3.2,0));};
  document.getElementById('labelsBtn').onclick=()=>{const input=document.querySelector('[data-layer="labels"]');input.checked=!input.checked;setLabels(input.checked)};
  document.getElementById('xrayBtn').onclick=()=>{xray=!xray;document.getElementById('xrayBtn').classList.toggle('active',xray);allObjects.forEach(e=>e.object.traverse(n=>{if(n.isMesh&&n.material){if(n.userData.originalTransparent===undefined){n.userData.originalTransparent=n.material.transparent;n.userData.originalOpacity=n.material.opacity}n.material.transparent=xray||n.userData.originalTransparent;n.material.opacity=xray?.35:n.userData.originalOpacity;n.material.depthWrite=!xray}}));toast(xray?'X-ray material mode enabled':'Standard material mode restored');};
  document.getElementById('screenshot').onclick=()=>{renderer.render(scene,camera);const a=document.createElement('a');a.download=`anatomy-joint-lab-${Date.now()}.png`;a.href=renderer.domElement.toDataURL('image/png');a.click();toast('Viewport exported as PNG');};
  const presets={front:[V(0,3.3,25),V(0,3.3,0)],back:[V(0,3.3,-25),V(0,3.3,0)],left:[V(-25,3.3,0),V(0,3.3,0)],right:[V(25,3.3,0),V(0,3.3,0)]};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const [p,t]=presets[b.dataset.view];animateCamera(p,t)});
  const ray=new THREE.Raycaster(),pointer=new THREE.Vector2(),hoverCard=document.getElementById('hoverCard');function targetFromEvent(e){const r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(bodyRoot.children,true).find(h=>h.object.userData.anatomy);return hit?.object.userData.anatomy;}
  renderer.domElement.addEventListener('click',e=>{const hit=targetFromEvent(e);if(hit)select(hit);});renderer.domElement.addEventListener('pointermove',e=>{const hit=targetFromEvent(e);if(hit){hoverCard.textContent=hit.name;hoverCard.style.display='block';hoverCard.style.left=`${e.offsetX+15}px`;hoverCard.style.top=`${e.offsetY+15}px`;renderer.domElement.style.cursor='pointer'}else{hoverCard.style.display='none';renderer.domElement.style.cursor='grab'}});
  const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=clock.getDelta();allObjects.forEach(e=>{const base=e.home||V();let target=base.clone();if(exploded)target.add(e.explode||V());if(e.detached)target.add(e.detachTarget||V());e.object.position.lerp(target,Math.min(1,dt*5));});controls.update();renderer.render(scene,camera);}animate();
  new ResizeObserver(()=>{const w=wrap.clientWidth,h=wrap.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}).observe(wrap);
  selectById('whole-body',false); toast('Select any structure to begin inspection');
</script>
</body>
